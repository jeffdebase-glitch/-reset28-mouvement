<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Roue Couple</title><style>
:root{--bg:#09050d;--panel:#17101d;--text:#fff;--muted:#d7c9df;--gold:#ffd166}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#30123f 0,#120817 38%,#070409 100%);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px;overflow-x:hidden}.app{width:min(94vw,760px);text-align:center}.title{font-size:clamp(28px,7vw,54px);font-weight:900;letter-spacing:.02em;margin:0 0 8px}.sub{color:var(--muted);margin:0 0 22px}.stage{position:relative;margin:auto;width:min(88vw,620px);aspect-ratio:1}.wheel-wrap{position:absolute;inset:6%;filter:drop-shadow(0 20px 50px #0008)}canvas{width:100%;height:100%;display:block;border-radius:50%;background:#111}.pointer{position:absolute;left:50%;top:0;transform:translateX(-50%);width:0;height:0;border-left:24px solid transparent;border-right:24px solid transparent;border-top:44px solid var(--gold);filter:drop-shadow(0 4px 6px #0009);z-index:4}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:25%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#fff 0 8%,#ffd166 9% 24%,#9b5de5 25% 55%,#2b1539 56%);border:6px solid #fff2;box-shadow:0 0 35px #ff4fd488;z-index:3;font-weight:900}.controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:999px;padding:16px 26px;font-weight:900;font-size:17px;cursor:pointer;background:linear-gradient(135deg,#ff4d8d,#9b5de5);color:white;box-shadow:0 12px 28px #7f2eb866}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.alt{display:none;background:#fff;color:#1d1024}.result{min-height:90px;margin-top:18px;display:grid;place-items:center}.card{display:none;padding:18px 22px;border-radius:22px;background:#ffffff12;border:1px solid #ffffff22;backdrop-filter:blur(12px);box-shadow:0 18px 60px #0008}.card.show{display:block;animation:pop .55s cubic-bezier(.2,1.4,.3,1)}.bravo{font-size:clamp(32px,9vw,66px);font-weight:1000;color:var(--gold);text-shadow:0 0 25px #ffd16688}.gain{font-size:clamp(24px,6vw,42px);font-weight:900;margin-top:4px}.flash{animation:flash .8s ease}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.piece{position:absolute;width:10px;height:18px;top:-30px;animation:fall 1.8s linear forwards}@keyframes fall{to{transform:translate(var(--x),110vh) rotate(900deg)}}@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}@keyframes flash{0%,100%{filter:none}35%{filter:brightness(1.7) saturate(1.4)}}.note{font-size:12px;color:#bdaac7;margin-top:18px}@media(max-width:520px){body{padding:14px}.pointer{border-left-width:18px;border-right-width:18px;border-top-width:34px}.btn{width:100%}}
</style></head><body><main class="app" id="app"><h1 class="title">La roue des défis 💋</h1><p class="sub">Fais tourner la roue et laisse le hasard décider.</p><section class="stage"><div class="pointer"></div><div class="wheel-wrap"><canvas id="wheel" width="900" height="900"></canvas></div><div class="hub">GO</div></section><div class="controls"><button class="btn" id="spin">TOURNE LA ROUE</button><button class="btn alt" id="again">REJOUER</button></div><div class="result"><div class="card" id="card"><div class="bravo">BRAVO !</div><div class="gain" id="gain"></div></div></div><div class="note">Jeu privé entre adultes consentants • aucun numéro n’est collecté</div></main><div class="confetti" id="confetti"></div><script>
const items=["un kiss","donne moi ton numéro de téléphone","retente ta chance","un bisou dans le cou","une fessée","un date","retente ta chance","un French kiss"];
const colors=["#ff4d8d","#9b5de5","#ff7b54","#f15bb5","#00bbf9","#ffd166","#7bd389","#ef476f"];
const canvas=document.getElementById("wheel"),ctx=canvas.getContext("2d"),spinBtn=document.getElementById("spin"),again=document.getElementById("again"),card=document.getElementById("card"),gain=document.getElementById("gain"),app=document.getElementById("app"),conf=document.getElementById("confetti");
const N=items.length, TAU=Math.PI*2, slice=TAU/N; let rot=0,spinning=false;
function fitText(text,maxWidth){let size=34;ctx.font="800 "+size+"px system-ui";while(ctx.measureText(text).width>maxWidth&&size>18){size--;ctx.font="800 "+size+"px system-ui"}return size}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);const c=450,r=430;ctx.save();ctx.translate(c,c);ctx.rotate(rot);
for(let i=0;i<N;i++){const a0=i*slice-slice/2;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,a0,a0+slice);ctx.closePath();ctx.fillStyle=colors[i];ctx.fill();ctx.lineWidth=7;ctx.strokeStyle="#ffffff22";ctx.stroke();
ctx.save();ctx.rotate(i*slice);ctx.translate(r*.62,0);ctx.fillStyle="white";ctx.textAlign="center";ctx.textBaseline="middle";const fs=Math.min(28,fitText(items[i],r*.48));ctx.font="800 "+fs+"px system-ui";wrap(items[i],0,0,r*.48,fs*1.12);ctx.restore()}
ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.lineWidth=18;ctx.strokeStyle="#f8e7ff";ctx.stroke();ctx.restore()}
function wrap(t,x,y,max,line){const words=t.split(" "),lines=[];let cur="";for(const w of words){const test=cur?cur+" "+w:w;if(ctx.measureText(test).width>max&&cur){lines.push(cur);cur=w}else cur=test}if(cur)lines.push(cur);lines.forEach((l,j)=>ctx.fillText(l,x,y+(j-(lines.length-1)/2)*line))}
draw();
function easeOut(t){return 1-Math.pow(1-t,4)}
function spin(){if(spinning)return;spinning=true;spinBtn.disabled=true;card.classList.remove("show");again.style.display="none";const winner=Math.floor(Math.random()*N);const current=((rot%TAU)+TAU)%TAU;const target=(-Math.PI/2 - winner*slice);let delta=(target-current+TAU)%TAU;const turns=6+Math.floor(Math.random()*3);delta+=turns*TAU;const start=rot,dur=5200,startTime=performance.now();let lastTick=-1;
function frame(now){const t=Math.min(1,(now-startTime)/dur);rot=start+delta*easeOut(t);draw();const tick=Math.floor((((rot%TAU)+TAU)%TAU)/slice);if(tick!==lastTick){lastTick=tick;if(navigator.vibrate&&t<.92)navigator.vibrate(8)}if(t<1)requestAnimationFrame(frame);else{rot=target;draw();const local=(((-Math.PI/2-rot)%TAU)+TAU)%TAU;const actual=Math.floor(((local+slice/2)%TAU)/slice)%N;finish(actual)}}requestAnimationFrame(frame)}
function finish(i){spinning=false;gain.textContent=items[i];card.classList.add("show");app.classList.add("flash");setTimeout(()=>app.classList.remove("flash"),850);again.style.display="inline-block";spinBtn.style.display="none";if(navigator.vibrate)navigator.vibrate([70,40,100]);burst()}
function burst(){conf.innerHTML="";for(let i=0;i<80;i++){const p=document.createElement("i");p.className="piece";p.style.left=Math.random()*100+"vw";p.style.background=colors[i%colors.length];p.style.setProperty("--x",(Math.random()*240-120)+"px");p.style.animationDelay=(Math.random()*.35)+"s";p.style.transform="rotate("+Math.random()*360+"deg)";conf.appendChild(p)}setTimeout(()=>conf.innerHTML="",2400)}
function reset(){card.classList.remove("show");again.style.display="none";spinBtn.style.display="inline-block";spinBtn.disabled=false}
spinBtn.onclick=spin;again.onclick=reset;
</script></body></html>
